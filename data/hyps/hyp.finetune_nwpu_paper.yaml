# AOFS Paper-Aligned Hyperparameters (NWPU-R)
# momentum = 0.999 per Section IV-B of the paper
# All other values identical to the author's public code configuration
lr0: 0.001
lrf: 0.2
momentum: 0.999  # paper-aligned: Section IV-B reports momentum coefﬁcient of 0.999
weight_decay: 0.0005
warmup_epochs: 3.0
warmup_momentum: 0.8
warmup_bias_lr: 0.1
box: 0.05
cls: 0.5
cls_pw: 1.0
theta: 0.5
theta_pw: 1.0
obj: 1.0
obj_pw: 1.0
iou_t: 0.2
anchor_t: 4.0
fl_gamma: 0.0
hsv_h: 0.015
hsv_s: 0.7
hsv_v: 0.4
degrees: 180.0
translate: 0.1
scale: 0.25
shear: 0.0
perspective: 0.0
flipud: 0.5
fliplr: 0.5
mosaic: 0.75
mixup: 0.1
copy_paste: 0.0
cls_theta: 180
csl_radius: 2.0

